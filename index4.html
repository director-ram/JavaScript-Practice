<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style4.css">
    <link rel="icon" href="images/ace,sabo,luffy.jpg">
    <title>JavaScript</title>
</head>
<body>
    <div id="calculattor">
        <input id="display" readonly value="">
        <div id="keys">
            <button onclick="appendToDisplay('+')" class="operator-btn">+</button>
            <button onclick="appendToDisplay('9')">9</button>
            <button onclick="appendToDisplay('8')">8</button>
            <button onclick="appendToDisplay('7')">7</button>
            <button onclick="appendToDisplay('-')" class="operator-btn">-</button>
            <button onclick="appendToDisplay('6')">6</button>
            <button onclick="appendToDisplay('5')">5</button>
            <button onclick="appendToDisplay('4')">4</button>
            <button onclick="appendToDisplay('*')" class="operator-btn">*</button>
            <button onclick="appendToDisplay('3')">3</button>
            <button onclick="appendToDisplay('2')">2</button>
            <button onclick="appendToDisplay('1')">1</button>
            <button onclick="appendToDisplay('/')" class="operator-btn">/</button>
            <button onclick="appendToDisplay('0')">0</button>
            <button onclick="appendToDisplay('00')">00</button>
            <button onclick="appendToDisplay('.')">.</button>
            <button onclick="appendToDisplay('^')" class="operator-btn">^</button>
            <button onclick="calculate()" id="result">=</button>
            <button onclick="clearDisplay()" id="clear">C</button>
        </div>
    </div>
    <br>
    <div id="DOM">
        <input id="user-input" type="text">
        <button onclick="execute()" class="msg-btn">Submit</button>
        <br>
        <h2 id="message"></h2>
    </div>
    <div>
        <ul id="fruits">Fruits:
            <li id="apple">apple</li>
            <li id="strawberry">strawberry</li>
            <li id="orange">orange</li>
        </ul>
        <br>
        <ul id="vegetables">Vegetables:
            <li id="carrot">carrot</li>
            <li id="cucumber">cucumber</li>
            <li id="cabage">cabage</li>
        </ul>
        <br>
        <ul id="junkFoods">JunkFoods:
            <li id="pizza">pizza</li>
            <li id="burger">burger</li>
            <li id="shawarma">shawarma</li>
        </ul>
    </div>
    <br>
    <div>
        <button id="myBtn">click here ⬇️</button>
    </div>
    <script src="script10.js"></script>
</body>
</html>
