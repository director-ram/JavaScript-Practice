<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style5.css">
    <link rel="icon" href="images/ace,sabo,luffy.jpg">
    <title>JavaScript</title>
</head>

<body>
    <div class="back">
        <a href="index4.html">
            <p id="back">back</p>
        </a>
    </div>
    <button id="myButton">Button</button>
    <br>
    <h1>Rock, Paper, Scissors</h1>
    <div class="options">
        <button onclick="playGame('rock')">✊</button>
        <button onclick="playGame('paper')">✋</button>
        <button onclick="playGame('scissor')">✌️</button>
    </div>
    <br>
    <div id="playerDisplay">PlayerChoice: </div>
    <div id="computerDisplay">ComputerChoice: </div>
    <div id="Result"></div>
    <br>
    <div class="ScoreDisplay">Player Score:
        <span id="playerScore">0</span>
    </div>
    <div class="ScoreDisplay">Computer Score:
        <span id="computerScore">0</span>
    </div>
    <div class="slider">
        <div class="slides">
            <img src="images/Dice-Images/1dice.png" alt="img1">
            <img src="images/Dice-Images/2dice.png" alt="img2">
            <img src="images/Dice-Images/3dice.png" alt="img3">
        </div>
        <button class="prev" onclick="prevSlide()">&#10094</button>
        <button class="next" onclick="nextSlide()">&#10095</button>
    </div>
    <br>
    <div class="pokemon">
        <input type="text" id="pokemonName" placeholder="Enter Pokemon Name"><br>
        <button onclick="getPokemon()" id="pokemonBtn">search pokemon</button>
        <p id="errorDisplay"></p>
        <img src="" id="pokemonDisplay" style="display: none;" alt="pokemonImg">
    </div>
    <script src="script11.js"></script>
</body>

</html>
